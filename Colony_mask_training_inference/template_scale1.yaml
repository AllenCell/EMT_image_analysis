# @package _global_
# to execute this experiment run:
# python train.py experiment=example

defaults:
- override /data: im2im/segmentation_all_cells_mask_from_zarr.yaml
- override /model: im2im/segmentation_all_cells_mask.yaml
- override /callbacks: default.yaml
- override /trainer: gpu.yaml
- override /logger: csv.yaml
tags:
- dev
seed: 12345
experiment_name: train_cytogfp_seg_model_v0
run_name: test_v0_patch1
source_col: raw
target_col: seg
spatial_dims: 3
raw_im_channels: 1
checkpoint:
  ckpt_path: ${paths.data_dir}/all_cells_mask_seg_model_checkpoint.ckpt
trainer:
  max_epochs: 1000
  devices:
  - 0
model:
  compile: true
  save_dir: scale1
data:
  csv_path: ${paths.data_dir}/all_moviepaths_qc_p1.csv
  _aux:
    patch_shape:
    - 16
    - 128
    - 128
  batch_size: 4
  num_workers: 0
  persistent_workers: false
callbacks:
  predict_saving:
    _target_: cyto_dl.callbacks.ImageSaver
    save_dir: ${model.save_dir}
    stages:
    - predict
    save_input: false