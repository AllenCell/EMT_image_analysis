[project]
name = "EMT_ColonyMask_merging_thresholding_rearranging"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "Allen Institute", email = "cells@alleninstitute.org"},
]
dependencies = [
    "aicsimageio",
    "opencv-python-headless",
    "matplotlib",
    "numpy<2.0.0",
    "pandas",
    "tifffile",
    "scikit-image",
    "cyto-dl @ git+https://github.com/AllenCellModeling/cyto-dl@221543844fbefe5a6027f0473c1f4b4eaf59c7b9",
    "bioio-ome-zarr",
    "bioio",
    "rich==14.0.0",
    "bioio-czi==2.4.2",
    "bioio-ome-tiff==1.3.0",
]
# cyto-dl does not support python >= 3.11 yet
requires-python = "==3.10.*"
readme = "README.md"
license = {text = "AISL"}


[tool.pdm]
distribution = false

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"
