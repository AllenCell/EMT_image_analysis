
_target_: monai.data.DataLoader
num_workers: 16
batch_size: 1
dataset:
  _target_: cyto_dl.datamodules.multidim_image.MultiDimImageDataset
  channel_column: ${column_channel}
  img_path_column: ${source_col}
  cache_num: 0
  transform:
    _target_: monai.transforms.Compose
    transforms:
      - _target_: cyto_dl.image.io.BioIOImageLoaderd
        path_key: original_path
        scene_key: ${scene_col}
        out_key: ${source_col}
        include_meta_in_filename: True 
      - _target_: monai.transforms.ToTensord
        keys: ${source_col}
      - _target_: monai.transforms.NormalizeIntensityd
        keys: ${source_col} 
      