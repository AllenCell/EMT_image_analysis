# @package _global_
# to execute this experiment run:
# python train.py experiment=example
defaults:
  - override /data: segmentation_basement_membrane_from_czi.yaml
  - override /model: segmentation_basement_membrane.yaml
  - override /callbacks: default.yaml
  - override /trainer: gpu.yaml
  - override /logger: csv.yaml

# all parameters below will be merged with parameters from default configurations set above
# this allows you to overwrite only specified parameters

tags: ["dev"]
seed: 12345
# basement_membrane_semseg_version_6_early_model_bigrun_H2B_EOMES
experiment_name: basement_membrane_semseg
run_name: basement_membrane_semseg
source_col: path
target_col: out_path
column_channel: channel
scene_col: scene
spatial_dims: 3
raw_im_channels: 1

paths:
  output_dir: /allen/aics/emt/basement_membrane_segmentation/Resubmission/segmentations

checkpoint:
  ckpt_path: /allen/aics/emt/basement_membrane_segmentation/Resubmission/collagenIV_mask_seg_model_checkpoint.ckpt

callbacks:
  segmentation_output:
    _target_: cyto_dl.callbacks.image_saver.ImageSaver
    save_dir: /allen/aics/emt/basement_membrane_segmentation/Resubmission/segmentations
    stages: ["train", "test", "val", "predict"]

data:
  dataset:
    csv_path: /allen/aics/emt/basement_membrane_segmentation/Resubmission/segmentation_manifest-s3-vast.csv
  _aux:
    patch_shape: [8, 512, 512]

